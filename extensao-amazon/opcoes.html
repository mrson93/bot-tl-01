<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Tá Barato · Lista de Ofertas</title>
  <style>
    body { font: 14px/1.4 Arial, sans-serif; margin: 16px; width: 320px; color: #111; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 10px; padding: 6px 12px; }
    small { color: #555; display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Lista de Ofertas da Amazon</h1>
  <p>Marque o checkbox amarelo nos produtos das páginas da Amazon. Eles são adicionados à sua lista em segundo plano.</p>
  <label for="lista">Código da lista</label>
  <input id="lista" placeholder="2ZUSMM2BR8LVZ">
  <small>É o código no fim do endereço da lista (amazon.com.br/shop/.../list/<b>CÓDIGO</b>).</small>
  <button id="salvar">Salvar</button>
  <small id="estado"></small>
  <script src="opcoes.js"></script>
</body>
</html>
