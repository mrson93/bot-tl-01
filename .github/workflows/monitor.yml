name: Monitor do Bot

on:
  schedule:
    # Economia temporaria: uma verificacao diaria, as 10:40 em Brasilia.
    - cron: "40 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  monitorar:
    # Quando o administrador pausa o bot, o monitor tambem para sem reservar runner.
    if: github.event_name == 'workflow_dispatch' || vars.BOT_MODE != 'pausado'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
