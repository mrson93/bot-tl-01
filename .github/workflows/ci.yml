name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test telegram-control/test/*.test.mjs telegram-control/scheduler/test/*.test.mjs
      - run: node --test site/test/*.test.mjs
      - run: node --test redirector/test/*.test.mjs
      - run: find site/functions telegram-control/src telegram-control/scheduler redirector/src -name '*.js' -print0 | xargs -0 -n1 node --check
